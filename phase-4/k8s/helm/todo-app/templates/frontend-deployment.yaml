apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: next-public-api-url
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
{{ toYaml .Values.frontend.resources | indent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  labels:
    app: frontend
spec:
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: 3000
    nodePort: 30080  # Specific node port for access
  selector:
    app: frontend
  type: {{ .Values.frontend.service.type }}